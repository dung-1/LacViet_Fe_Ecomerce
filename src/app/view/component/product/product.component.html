<div class="page-header">
  <h1 class="page-title">Quản lý sản phẩm</h1>
  <button mat-raised-button color="primary" type="button" (click)="openAddDialog()">
    <mat-icon>add</mat-icon>
    Thêm sản phẩm
  </button>
</div>

<mat-card class="table-card">
  <mat-card-content>
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Tìm kiếm</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Tên sản phẩm..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <table mat-table [dataSource]="dataSource" class="full-width">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Tên sản phẩm</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Giá</th>
        <td mat-cell *matCellDef="let row">{{ row.price | currency : 'VND' }}</td>
      </ng-container>

      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Ảnh</th>
        <td mat-cell *matCellDef="let row">
          <img
            *ngIf="row.image"
            [src]="getFullImageUrl(row.image)"
            [alt]="row.name"
            class="thumb-image"
          />
        </td>
      </ng-container>

      <ng-container matColumnDef="categoryId">
        <th mat-header-cell *matHeaderCellDef>Loại</th>
        <td mat-cell *matCellDef="let row">
          {{ getCategoryName(row.categoryId) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Thao tác</th>
        <td mat-cell *matCellDef="let row">
          <button
            mat-icon-button
            color="primary"
            type="button"
            matTooltip="Sửa"
            (click)="openEditDialog(row)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            type="button"
            matTooltip="Xóa"
            (click)="deleteProduct(row.id)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          Không có dữ liệu
        </td>
      </tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 25]"
      [pageSize]="10"
      showFirstLastButtons
    ></mat-paginator>
  </mat-card-content>
</mat-card>
