<div class="page-header">
  <h1 class="page-title">Chỉnh sửa bài viết</h1>
  <button mat-stroked-button type="button" routerLink="/post">
    <mat-icon>arrow_back</mat-icon>
    Quay lại danh sách
  </button>
</div>

<mat-card>
  <mat-card-content>
    <form (ngSubmit)="updatePost()">
      <mat-tab-group>
        <mat-tab label="Thông tin bài viết">
          <div class="post-form-section">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Tiêu đề bài viết</mat-label>
              <input matInput [(ngModel)]="post.title" name="title" required />
            </mat-form-field>

            <h4>Nội dung bài viết</h4>
            <ejs-richtexteditor
              height="400px"
              cssClass="e-outline"
              [(ngModel)]="post.content"
              name="content"
              required
            ></ejs-richtexteditor>
          </div>
        </mat-tab>

        <mat-tab label="Thông tin chi tiết">
          <div class="post-form-section">
            <div class="post-form-grid">
              <div>
                <h4>Thể loại bài viết</h4>
                <ejs-combobox
                  [(ngModel)]="post.categoryId"
                  [ngModelOptions]="{ standalone: true }"
                  [dataSource]="vegetableData"
                  [placeholder]="groupWaterMark"
                  [fields]="groupFields"
                  [popupHeight]="height"
                ></ejs-combobox>
              </div>
              <div>
                <h4>Hình ảnh bài viết</h4>
                <ejs-uploader
                  #defaultupload
                  [asyncSettings]="path"
                  [autoUpload]="false"
                  (selected)="onFileSelected($event)"
                  [buttons]="{ browse: 'Chọn file' }"
                ></ejs-uploader>
                <button ejs-button type="button" (click)="uploadFile()">Upload</button>
              </div>
            </div>

            <div class="post-form-grid">
              <div>
                <h4>Ngày bắt đầu</h4>
                <ejs-datepicker
                  class="e-input-fill"
                  [(ngModel)]="post.fromDate"
                  name="fromDate"
                ></ejs-datepicker>
              </div>
              <div>
                <h4>Ngày kết thúc</h4>
                <ejs-datepicker
                  class="e-input-fill"
                  [(ngModel)]="post.toDate"
                  name="toDate"
                ></ejs-datepicker>
              </div>
            </div>
          </div>
        </mat-tab>
      </mat-tab-group>

      <div class="post-form-actions">
        <button mat-stroked-button type="button" routerLink="/post">Hủy</button>
        <button mat-flat-button color="primary" type="submit">Cập nhật</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
