<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <input *ngIf="data.mode === 'edit'" type="hidden" formControlName="id" />

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tên sản phẩm</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Giá sản phẩm</mat-label>
      <input matInput type="number" formControlName="price" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Danh mục</mat-label>
      <mat-select formControlName="categoryId">
        <mat-option value="" disabled>--- Chọn loại sản phẩm ---</mat-option>
        <mat-option *ngFor="let category of data.categories" [value]="category.id">
          {{ category.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="file-field">
      <label>Hình ảnh sản phẩm</label>
      <input type="file" (change)="onFileChange($event)" accept="image/*" />
      <img
        *ngIf="currentImageUrl"
        [src]="currentImageUrl"
        alt="Ảnh hiện tại"
        class="preview-image"
      />
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()">Hủy</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="form.invalid"
    (click)="onSave()"
  >
    Lưu
  </button>
</mat-dialog-actions>
